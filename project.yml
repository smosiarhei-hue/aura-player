name: Sonivo
options:
  bundleIdPrefix: com.smoze
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  AutoMixV2:
    path: Packages/AutoMixV2
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  Sonivo:
    type: application
    platform: iOS
    sources:
      - path: Aurora
        excludes:
          - "Info.plist"
          - "PlayerScreen.swift"
    dependencies:
      - package: AutoMixV2
        product: MixModels
      - package: AutoMixV2
        product: TrackSource
      - package: AutoMixV2
        product: AudioEngineCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smoze.sonivo
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: Aurora/Info.plist
      properties:
        CFBundleDisplayName: Sonivo
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.smoze.sonivo
            CFBundleURLSchemes:
              - sonivo
              - aurora
  SonivoUnitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/UnitTests
    dependencies:
      - package: AutoMixV2
        product: MixModels
      - package: AutoMixV2
        product: TrackSource
      - package: AutoMixV2
        product: AudioEngineCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smoze.sonivo.UnitTests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  Sonivo:
    build:
      targets:
        Sonivo: all
        SonivoUnitTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SonivoUnitTests
    run:
      config: Debug
    archive:
      config: Release
