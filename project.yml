name: Sonivo
options:
  bundleIdPrefix: com.smoze
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
      buildPhase: resources
packages:
  StreamAudioProbe:
    path: Packages/StreamAudioProbe
  AutoMixV2:
    path: Packages/AutoMixV2
  NeuroMix:
    path: Packages/NeuroMix
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  Sonivo:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Materialize App Icon Variants
        script: |
          python3 "$SRCROOT/scripts/materialize_app_icons.py"
          python3 "$SRCROOT/scripts/materialize_activity_brand.py"
          python3 "$SRCROOT/scripts/materialize_karaoke_font.py"
        basedOnDependencyAnalysis: false
    sources:
      - path: Sonivo
        excludes:
          - "Info.plist"
          - "PlayerScreen.swift"
          - "AppIcons"
          - "KaraokeFonts"
      - path: Sonivo/KaraokeFonts
        type: folder
        buildPhase: resources
      - path: Sonivo/AppIcons/SonivoMusic.icon
        type: file
        buildPhase: resources
      - path: Sonivo/AppIcons/SignatureS.icon
        type: file
        buildPhase: resources
      - path: Sonivo/AppIcons/SonivoWordmark.icon
        type: file
        buildPhase: resources
      - path: Sonivo/AppIcons/ClassicWave.icon
        type: file
        buildPhase: resources
      - path: Sonivo/AppIcons/MusicGraphite.icon
        type: file
        buildPhase: resources
      - path: Sonivo/AppIcons/MusicPrism.icon
        type: file
        buildPhase: resources
      - path: Sonivo/AppIcons/MusicSapphire.icon
        type: file
        buildPhase: resources
      - path: Sonivo/AppIcons/MusicNeon.icon
        type: file
        buildPhase: resources
      - path: SharedActivity
    dependencies:
      - target: SonivoLiveActivity
        embed: true
      - package: StreamAudioProbe
        product: StreamAudioProbe
      - package: AutoMixV2
        product: MixModels
      - package: AutoMixV2
        product: TrackSource
      - package: AutoMixV2
        product: TrackAnalysis
      - package: AutoMixV2
        product: MixPlanner
      - package: AutoMixV2
        product: AudioEngineCore
      - package: AutoMixV2
        product: PlaybackCoordinator
      - package: AutoMixV2
        product: MixDiagnostics
      - package: NeuroMix
        product: NeuroMixEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smoze.sonivo
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: SonivoMusic
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "SignatureS SonivoWordmark ClassicWave MusicGraphite MusicPrism MusicSapphire MusicNeon"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: Sonivo/Info.plist
      properties:
        CFBundleDisplayName: Sonivo
        NSSupportsLiveActivities: true
        SonivoLiveActivityEmbedded: true
        CFBundleDevelopmentRegion: ru
        UIAppFonts:
          - KaraokeFonts/Onest-Bold.ttf
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        UILaunchScreen:
          UIColorName: SonivoLaunchBackground
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        ITSAppUsesNonExemptEncryption: false
        NSSpeechRecognitionUsageDescription: "Sonivo использует Apple Neural Engine для автономной синхронизации текста песен в режиме караоке."
        NSMicrophoneUsageDescription: "Sonivo использует аудиодвижок для анализа вокала и караоке-таймкодов."
        CFBundleURLTypes:
          - CFBundleURLName: com.smoze.sonivo
            CFBundleURLSchemes:
              - sonivo
              - aurora
  SonivoLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SonivoLiveActivity
        excludes: ["Info.plist"]
      - path: SharedActivity
    preBuildScripts:
      - name: Materialize Activity Brand
        script: python3 "$SRCROOT/scripts/materialize_activity_brand.py"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smoze.sonivo.LiveActivity
        DEVELOPMENT_TEAM: ""
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: SonivoLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Sonivo
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SonivoUnitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/UnitTests
    dependencies:
      - package: AutoMixV2
        product: MixModels
      - package: AutoMixV2
        product: TrackSource
      - package: AutoMixV2
        product: TrackAnalysis
      - package: AutoMixV2
        product: MixPlanner
      - package: AutoMixV2
        product: AudioEngineCore
      - package: AutoMixV2
        product: PlaybackCoordinator
      - package: AutoMixV2
        product: MixDiagnostics
      - package: NeuroMix
        product: NeuroMixEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smoze.sonivo.UnitTests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
  SonivoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/UITests
    dependencies:
      - target: Sonivo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smoze.sonivo.UITests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  SonivoLiveActivity:
    build:
      targets:
        SonivoLiveActivity: all
  Sonivo:
    build:
      targets:
        Sonivo: all
        SonivoUnitTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SonivoUnitTests
        - SonivoUITests
    run:
      config: Debug
    archive:
      config: Release
