name: Sonivo
options:
  bundleIdPrefix: com.smoze
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  Sonivo:
    type: application
    platform: iOS
    sources:
      - Aurora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smoze.sonivo
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0-Beta"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Aurora/Info.plist
      properties:
        CFBundleDisplayName: Sonivo
        CFBundleShortVersionString: "1.0.0-Beta"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppleMusicUsageDescription: "Sonivo использует доступ к медиатеке Apple Music для поиска и воспроизведения ваших сохраненных треков на iPhone."
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        ITSAppUsesNonExemptEncryption: false
schemes:
  Sonivo:
    build:
      targets:
        Sonivo: all
    run:
      config: Debug
    archive:
      config: Release
