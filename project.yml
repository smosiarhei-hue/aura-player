name: Sonivo
options:
  bundleIdPrefix: com.smoze
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  VKID:
    url: https://github.com/VKCOM/vkid-ios-sdk.git
    from: 2.9.5
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    VKID_CLIENT_ID: "54753449"
    VKID_CLIENT_SECRET: ""
targets:
  Sonivo:
    type: application
    platform: iOS
    sources:
      - path: Aurora
        excludes:
          - "Info.plist"
          - "PlayerScreen.swift"
    dependencies:
      - package: VKID
        product: VKID
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smoze.sonivo
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: Aurora/Info.plist
      properties:
        CFBundleDisplayName: Sonivo
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        CLIENT_ID: "$(VKID_CLIENT_ID)"
        CLIENT_SECRET: "$(VKID_CLIENT_SECRET)"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        LSApplicationQueriesSchemes:
          - vkauthorize-silent
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.smoze.sonivo
            CFBundleURLSchemes:
              - sonivo
              - aurora
          - CFBundleTypeRole: Editor
            CFBundleURLName: auth_callback
            CFBundleURLSchemes:
              - vk54753449
schemes:
  Sonivo:
    build:
      targets:
        Sonivo: all
    run:
      config: Debug
    archive:
      config: Release
