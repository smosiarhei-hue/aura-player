services:
  - type: worker
    name: sonivo-telegram-bot
    runtime: python
    buildCommand: ""
    startCommand: python scripts/telegram_agent_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
