# Path: .github/workflows/build-ipa.yml
name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [ main, feature/automix-engine-v2 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The trusted AutoMix branch is built on push; other PRs still build without delivery.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'feature/automix-engine-v2'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Test IPA delivery safety
        run: python3 -m unittest discover -s .github/scripts -p 'test_send_ipa_telegram.py' -v

      - name: Compute version (auto-increment per build)
        id: version
        run: |
          RUN=${{ github.run_number }}
          BASE_RUN=50
          BASE_PATCH=1
          PATCH=$((BASE_PATCH + RUN - BASE_RUN))
          echo "MARKETING_VERSION=1.0.$PATCH" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$RUN" >> "$GITHUB_ENV"
          echo "Computed version: 1.0.$PATCH (build #$RUN)"

      - name: Inject version into project.yml
        run: |
          sed -i '' -E "s/(MARKETING_VERSION: \")[0-9.]+(\")/\1${MARKETING_VERSION}\2/" project.yml
          sed -i '' -E "s/(CURRENT_PROJECT_VERSION: \")[0-9]+(\")/\1${BUILD_NUMBER}\2/" project.yml
          sed -i '' -E "s/(CFBundleShortVersionString: \")[0-9.]+(\")/\1${MARKETING_VERSION}\2/" project.yml
          sed -i '' -E "s/(CFBundleVersion: \")[0-9]+(\")/\1${BUILD_NUMBER}\2/" project.yml
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION|CFBundleShortVersionString|CFBundleVersion" project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for values in data["devices"].values() for d in values if d.get("isAvailable")]; print(devices[0]["udid"] if devices else "")')
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iOS simulator found"
            exit 1
          fi
          echo "Using simulator: $SIMULATOR_ID"
          xcodebuild \
            -project Sonivo.xcodeproj \
            -scheme Sonivo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath derived-tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test 2>&1 | tee test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          if-no-files-found: warn

      - name: Build unsigned app
        id: xcodebuild
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Sonivo.xcodeproj \
            -scheme Sonivo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Publish build status
        if: always() && steps.xcodebuild.outcome != 'skipped' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.xcodebuild.outcome }}
        run: |
          printf "Commit: %s\nRun: %s\nOutcome: %s\n\n" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$BUILD_OUTCOME" > diagnostic.txt
          if [ "$BUILD_OUTCOME" = "success" ]; then
            echo "BUILD SUCCEEDED" >> diagnostic.txt
          else
            grep -nE "error:|fatal error:|BUILD FAILED|Command SwiftCompile failed" build.log | tail -n 250 > compiler-errors.txt || true
            if [ ! -s compiler-errors.txt ]; then
              tail -n 300 build.log > compiler-errors.txt
            fi
            cat compiler-errors.txt >> diagnostic.txt
          fi
          TMP=$(mktemp -d)
          cd "$TMP"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b ci-diagnostics
          mkdir -p ci-logs
          cp "$GITHUB_WORKSPACE/diagnostic.txt" ci-logs/latest-build-errors.txt
          git add ci-logs/latest-build-errors.txt
          git commit -m "Record build status from run $GITHUB_RUN_ID"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin ci-diagnostics

      - name: Upload build log
        if: always() && steps.xcodebuild.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Package unsigned IPA
        run: |
          APP=$(find derived/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          echo "Found application bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Sonivo-unsigned.ipa Payload
          ls -lh Sonivo-unsigned.ipa

      # Persist the IPA before attempting any external delivery.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonivo-unsigned-ipa
          path: Sonivo-unsigned.ipa
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Sonivo-unsigned.ipa
          generate_release_notes: true

  telegram:
    needs: build
    # Never expose Telegram credentials to PR jobs or arbitrary manual branches.
    if: >-
      github.repository == 'smosiarhei-hue/aura-player' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/feature/automix-engine-v2' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Sonivo-unsigned-ipa
      - name: Send IPA to configured Telegram chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/send_ipa_telegram.py

      - name: Publish safe Telegram delivery status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Commit: %s\nRun: %s\nTelegram status: %s\nTelegram response: %s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "${TELEGRAM_STATUS:-not_run}" \
            "${TELEGRAM_RESPONSE:-Delivery did not run; inspect the job steps.}" > telegram-diagnostic.txt
          TMP=$(mktemp -d)
          cd "$TMP"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin ci-diagnostics
          git checkout -b ci-diagnostics FETCH_HEAD
          mkdir -p ci-logs
          cp "$GITHUB_WORKSPACE/telegram-diagnostic.txt" ci-logs/latest-telegram-delivery.txt
          git add ci-logs/latest-telegram-delivery.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Telegram delivery from run $GITHUB_RUN_ID"
            git push origin ci-diagnostics
          fi
