# Path: .github/workflows/build-ipa.yml
name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/automix-engine-v2
      - feature/automix-stage4-effects
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Test IPA delivery safety
        run: python3 -m unittest discover -s .github/scripts -p 'test_send_ipa_telegram.py' -v

      - name: Compute version
        run: |
          RUN=${{ github.run_number }}
          PATCH=$((1 + RUN - 50))
          echo "MARKETING_VERSION=1.0.$PATCH" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$RUN" >> "$GITHUB_ENV"

      - name: Inject version into project.yml
        run: |
          sed -i '' -E "s/(MARKETING_VERSION: \")[0-9.]+(\")/\1${MARKETING_VERSION}\2/" project.yml
          sed -i '' -E "s/(CURRENT_PROJECT_VERSION: \")[0-9]+(\")/\1${BUILD_NUMBER}\2/" project.yml
          sed -i '' -E "s/(CFBundleShortVersionString: \")[0-9.]+(\")/\1${MARKETING_VERSION}\2/" project.yml
          sed -i '' -E "s/(CFBundleVersion: \")[0-9]+(\")/\1${BUILD_NUMBER}\2/" project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        id: xcodebuild
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Sonivo.xcodeproj \
            -scheme Sonivo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Package unsigned IPA
        run: |
          APP=$(find derived/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Sonivo-unsigned.ipa Payload
          ls -lh Sonivo-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonivo-unsigned-ipa
          path: Sonivo-unsigned.ipa
          if-no-files-found: error

      - name: Send IPA to configured Telegram chat
        if: >-
          github.repository == 'smosiarhei-hue/aura-player' &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/feature/automix-engine-v2' ||
           github.ref == 'refs/heads/feature/automix-stage4-effects' ||
           startsWith(github.ref, 'refs/tags/v'))
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8559869613' }}
        run: python3 .github/scripts/send_ipa_telegram.py

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Sonivo-unsigned.ipa
          generate_release_notes: true
