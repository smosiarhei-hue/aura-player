name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Compute version (auto-increment per build)
        id: version
        run: |
          RUN=${{ github.run_number }}
          BASE_RUN=50
          BASE_PATCH=1
          PATCH=$((BASE_PATCH + RUN - BASE_RUN))
          echo "MARKETING_VERSION=1.0.$PATCH" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$RUN" >> "$GITHUB_ENV"
          echo "Computed version: 1.0.$PATCH (build #$RUN)"

      - name: Inject version into project.yml
        run: |
          sed -i '' -E "s/(MARKETING_VERSION: \")[0-9.]+(\")/\1${MARKETING_VERSION}\2/" project.yml
          sed -i '' -E "s/(CURRENT_PROJECT_VERSION: \")[0-9]+(\")/\1${BUILD_NUMBER}\2/" project.yml
          sed -i '' -E "s/(CFBundleShortVersionString: \")[0-9.]+(\")/\1${MARKETING_VERSION}\2/" project.yml
          sed -i '' -E "s/(CFBundleVersion: \")[0-9]+(\")/\1${BUILD_NUMBER}\2/" project.yml
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION|CFBundleShortVersionString|CFBundleVersion" project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        id: xcodebuild
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Sonivo.xcodeproj \
            -scheme Sonivo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Publish build status
        if: always() && steps.xcodebuild.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.xcodebuild.outcome }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          printf "Commit: %s\nRun: %s\nOutcome: %s\n\n" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$BUILD_OUTCOME" > diagnostic.txt
          if [ "$BUILD_OUTCOME" = "success" ]; then
            echo "BUILD SUCCEEDED" >> diagnostic.txt
          else
            grep -nE "error:|fatal error:|BUILD FAILED|Command SwiftCompile failed" build.log | tail -n 250 > compiler-errors.txt || true
            if [ ! -s compiler-errors.txt ]; then
              tail -n 300 build.log > compiler-errors.txt
            fi
            cat compiler-errors.txt >> diagnostic.txt
          fi

          DIAG_BRANCH="ci-diagnostics"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            DIAG_BRANCH="ci-diagnostics-pr-${PR_NUMBER}"
          fi

          TMP=$(mktemp -d)
          cd "$TMP"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$DIAG_BRANCH"
          mkdir -p ci-logs
          cp "$GITHUB_WORKSPACE/diagnostic.txt" ci-logs/latest-build-errors.txt
          git add ci-logs/latest-build-errors.txt
          git commit -m "Record build status from run $GITHUB_RUN_ID"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$DIAG_BRANCH"

      - name: Upload build log
        if: always() && steps.xcodebuild.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Package unsigned IPA
        run: |
          APP=$(find derived/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          echo "Found application bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Sonivo-unsigned.ipa Payload
          ls -lh Sonivo-unsigned.ipa

      - name: Send IPA to Telegram
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets are not configured, skipping delivery."
            exit 0
          fi
          RESPONSE=$(curl -s -F chat_id="${TELEGRAM_CHAT_ID}" \
               -F document=@Sonivo-unsigned.ipa \
               -F caption="Sonivo IPA готов к установке! (Сборка: #${BUILD_NUMBER})" \
               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument")
          echo "Telegram response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Telegram delivery succeeded."
          else
            echo "::warning::Telegram delivery failed: $RESPONSE"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonivo-unsigned-ipa
          path: Sonivo-unsigned.ipa

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Sonivo-unsigned.ipa
          generate_release_notes: true
