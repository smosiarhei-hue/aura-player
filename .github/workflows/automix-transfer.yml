name: Transfer AutoMix commit to requested branch
on:
  push:
    branches: [agent/automix-ios-check-20261108]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit changes to feature branch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/automix-transfer.patch "$RUNNER_TEMP/automix.patch"
          git fetch origin feature/modern-my-wave-home
          git checkout -B feature/modern-my-wave-home origin/feature/modern-my-wave-home
          test "$(git rev-parse HEAD)" = "13c5ed87755757ad7578c788f2a6bdc417416ba9" || { echo "Target changed; refusing to overwrite"; exit 1; }
          git apply --check "$RUNNER_TEMP/automix.patch"
          git apply "$RUNNER_TEMP/automix.patch"
          git add Sonivo/playercore.swift tools/automix-lab/package.json tools/automix-lab/src/audio/analyzeTrack.ts tools/automix-lab/src/audio/keyCamelot.ts tools/automix-lab/src/audio/waveRadio.ts tools/automix-lab/src/iphone-mock.ts tools/automix-lab/scripts/smoke-camelot-roundtrip.mjs tools/automix-lab/scripts/test-tempo.mjs
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Improve AutoMix tempo analysis and transition effects"
          git push origin HEAD:refs/heads/feature/modern-my-wave-home
          echo "Committed $(git rev-parse HEAD) on feature/modern-my-wave-home" >> "$GITHUB_STEP_SUMMARY"
