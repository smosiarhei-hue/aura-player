name: Inspect isolated iOS test failure
on:
  push:
    branches: [agent/automix-ios-check-20261108]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Summarize failed test log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/smosiarhei-hue/aura-player/actions/artifacts/13625098668/zip > "$RUNNER_TEMP/test-log.zip"
          unzip -p "$RUNNER_TEMP/test-log.zip" > "$RUNNER_TEMP/test.log"
          grep -Ei 'error:|failed|failure|unavailable|unsupported|cannot find' "$RUNNER_TEMP/test.log" | tail -n 25 | while IFS= read -r line; do
            line="${line:0:700}"
            line="${line//'%'/'%25'}"
            echo "::notice title=iOS test diagnostic::$line"
          done || true
