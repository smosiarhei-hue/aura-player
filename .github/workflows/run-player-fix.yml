name: Run player repair

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/run-player-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute reviewed repair script
        run: |
          awk '/python3 <<'"'"'PY'"'"'/{copy=1; next} /^          PY$/{copy=0} copy {sub(/^          /, ""); print}' .github/workflows/apply-player-fix.yml > /tmp/player_fix.py
          python3 /tmp/player_fix.py
          python3 <<'PY'
          from pathlib import Path
          overlay = Path('Aurora/AutoMixTransitionOverlay.swift')
          overlay.write_text(overlay.read_text().replace('@Environment(\\\\.accessibility', '@Environment(\\.accessibility')))
          player = Path('Aurora/PlayerScreenV2.swift')
          player.write_text(player.read_text().replace('''            .drawingGroup(opaque: true, colorMode: .extendedLinear)
''', ''))
          PY
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Aurora/PlayerScreenV2.swift
          git commit -m "Fix full-screen VideoShot and player dismissal [skip ci]"
          git add Aurora/playercore.swift
          git commit -m "Expose AutoMix hand-off and gate foreground Now Playing [skip ci]"
          git add Aurora/AutoMixTransitionOverlay.swift
          git commit -m "Animate incoming AutoMix artwork [skip ci]"
          git add Aurora/auroraapp.swift
          git commit -m "Sync Now Playing publication with scene state"
          git push origin HEAD:main

# Triggered after review.
