name: AutoMix V2 PlayerCore patch

on:
  push:
    branches: [feature/automix-engine-v2]
    paths: [.github/workflows/automix-v2-playercore-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/automix-engine-v2
      - name: Patch PlayerCore and runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          core_path = Path("Aurora/playercore.swift")
          core = core_path.read_text()

          core = replace_once(core, '''    func togglePlay() {
              if currentTrack == nil {''', '''    func togglePlay() {
              if AutoMixEngineSelectionStore.shared.isV2Enabled {
                  Task { await AutoMixV2Runtime.shared.toggle() }
                  return
              }
              if currentTrack == nil {''', "toggle")

          core = replace_once(core, '''    func play(_ track: Track, newQueue: [Track]? = nil) {
              flushListeningStats()''', '''    func play(_ track: Track, newQueue: [Track]? = nil) {
              if AutoMixEngineSelectionStore.shared.isV2Enabled {
                  Task { await AutoMixV2Runtime.shared.play(track, queue: newQueue ?? [track]) }
                  return
              }
              flushListeningStats()''', "play")

          core = replace_once(core, '''    func pause() {
              guard isPlaying else { return }''', '''    func pause() {
              if AutoMixEngineSelectionStore.shared.isV2Enabled {
                  Task { await AutoMixV2Runtime.shared.pause() }
                  return
              }
              guard isPlaying else { return }''', "pause")

          core = replace_once(core, '''    func resume() {
              guard !isPlaying, let track = currentTrack else { return }''', '''    func resume() {
              if AutoMixEngineSelectionStore.shared.isV2Enabled {
                  Task { await AutoMixV2Runtime.shared.play() }
                  return
              }
              guard !isPlaying, let track = currentTrack else { return }''', "resume")

          core = replace_once(core, '''    func next() {
              cancelTransition()''', '''    func next() {
              if AutoMixEngineSelectionStore.shared.isV2Enabled {
                  Task { await AutoMixV2Runtime.shared.next() }
                  return
              }
              cancelTransition()''', "next")

          core = replace_once(core, '''    func previous() {
              cancelTransition()''', '''    func previous() {
              if AutoMixEngineSelectionStore.shared.isV2Enabled {
                  Task { await AutoMixV2Runtime.shared.previous() }
                  return
              }
              cancelTransition()''', "previous")

          core = replace_once(core, '''    func seek(to seconds: Double) {
              cancelTransition()''', '''    func seek(to seconds: Double) {
              if AutoMixEngineSelectionStore.shared.isV2Enabled {
                  Task { await AutoMixV2Runtime.shared.seek(to: seconds) }
                  return
              }
              cancelTransition()''', "seek")

          marker = '''    func stopAndClear() {
'''
          external = '''    func prepareForExternalPlayback(_ track: Track, queue externalQueue: [Track]) {
              let usesV2 = AutoMixEngineSelectionStore.shared.isV2Enabled
              if usesV2 {
                  UserDefaults.standard.set(false, forKey: AutoMixEngineSelectionStore.defaultsKey)
              }
              stopAndClear()
              if usesV2 {
                  UserDefaults.standard.set(true, forKey: AutoMixEngineSelectionStore.defaultsKey)
              }
              currentTrack = track
              queue = externalQueue.isEmpty ? [track] : externalQueue
              streamDuration = track.duration
              progress = 0
              pausedProgress = 0
              isPlaying = false
              updateNowPlayingInfo()
          }

          func updateExternalPlaybackState(isPlaying externalIsPlaying: Bool, progress externalProgress: Double? = nil) {
              isPlaying = externalIsPlaying
              if let externalProgress {
                  progress = max(0, externalProgress)
                  pausedProgress = progress
              }
              updateNowPlayingInfo()
          }

          func clearExternalPlaybackPresentation() {
              let usesV2 = AutoMixEngineSelectionStore.shared.isV2Enabled
              if usesV2 {
                  UserDefaults.standard.set(false, forKey: AutoMixEngineSelectionStore.defaultsKey)
              }
              stopAndClear()
              if usesV2 {
                  UserDefaults.standard.set(true, forKey: AutoMixEngineSelectionStore.defaultsKey)
              }
          }

'''
          core = replace_once(core, marker, external + marker, "external presentation")
          core_path.write_text(core)

          runtime_path = Path("Aurora/AutoMixV2AppBridge.swift")
          runtime = runtime_path.read_text()
          runtime = replace_once(runtime, '''        PlayerCore.shared.stopAndClear()
        await diagnostics.record''', '''        PlayerCore.shared.prepareForExternalPlayback(track, queue: queue)
        await diagnostics.record''', "runtime prepare")
          runtime = replace_once(runtime, '''            isPlaying = true
            isLoading = false
            await diagnostics.record''', '''            isPlaying = true
            isLoading = false
            PlayerCore.shared.updateExternalPlaybackState(isPlaying: true)
            await diagnostics.record''', "runtime started")
          runtime = replace_once(runtime, '''            try await coordinator.resume()
            isPlaying = true''', '''            try await coordinator.resume()
            isPlaying = true
            PlayerCore.shared.updateExternalPlaybackState(isPlaying: true)''', "runtime resume")
          runtime = replace_once(runtime, '''        await coordinator.pause()
        isPlaying = false''', '''        await coordinator.pause()
        isPlaying = false
        PlayerCore.shared.updateExternalPlaybackState(isPlaying: false)''', "runtime pause")
          runtime = replace_once(runtime, '''        queue = []
    }

    func toggle()''', '''        queue = []
        PlayerCore.shared.clearExternalPlaybackPresentation()
    }

    func toggle()''', "runtime stop")
          runtime_path.write_text(runtime)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/automix-v2-playercore-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Aurora/playercore.swift Aurora/AutoMixV2AppBridge.swift .github/workflows/automix-v2-playercore-patch.yml
          git commit -m "Route all player controls through AutoMix V2"
          git push origin HEAD:feature/automix-engine-v2
