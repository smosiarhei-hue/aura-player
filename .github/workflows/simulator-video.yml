# Path: .github/workflows/simulator-video.yml
name: Simulator Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: simulator-video
  cancel-in-progress: true

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Test video delivery safety
        run: python3 -m unittest discover -s .github/scripts -p 'test_send_video_telegram.py' -v

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        id: build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Sonivo.xcodeproj \
            -scheme Sonivo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Boot iPhone 17 Pro simulator and install app
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)
          best = None
          for devices in data["devices"].values():
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  match = re.match(r"iPhone (\d+)", device.get("name", ""))
                  if not match:
                      continue
                  key = (int(match.group(1)), device["name"])
                  if best is None or key > best[0]:
                      best = (key, device["udid"])
          print(best[1] if best else "")')
          test -n "$DEVICE"
          echo "DEVICE_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b

          APP=$(find derived/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          xcrun simctl install "$DEVICE" "$APP"

      - name: Record simulator video with app launched
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl launch "$DEVICE_UDID" com.smoze.sonivo
          sleep 2
          xcrun simctl io "$DEVICE_UDID" recordVideo --codec h264 --force Sonivo-sim.mp4 &
          RECORDER=$!
          sleep 25
          kill -INT $RECORDER
          wait $RECORDER || true
          ls -lh Sonivo-sim.mp4

      - name: Compress video if needed
        shell: bash
        run: |
          if [ -f Sonivo-sim.mp4 ]; then
            SIZE=$(stat -f%z Sonivo-sim.mp4)
            echo "size=$SIZE"
            if [ "$SIZE" -gt 40000000 ]; then
              brew install ffmpeg
              ffmpeg -y -i Sonivo-sim.mp4 -b:v 1M -b:a 32k Sonivo-sim-small.mp4
              mv Sonivo-sim-small.mp4 Sonivo-sim.mp4
            fi
            ls -lh Sonivo-sim.mp4
          else
            echo "No video recorded" >&2
            exit 1
          fi

      - name: Send video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8559869613' }}
        run: python3 .github/scripts/send_video_telegram.py

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonivo-simulator-video
          path: Sonivo-sim.mp4
          if-no-files-found: warn
