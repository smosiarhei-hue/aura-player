# Isolated AutoMix validation: no Pages, Telegram, or releases.
name: AutoMix isolated iOS build
on:
  push:
    branches: [agent/automix-ios-check-20261108]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: automix-ios-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # macos-26 jobs can remain unassigned and are cancelled after 15 minutes.
    # Use the generally available hosted image so release validation actually runs.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply and commit AutoMix changes on test branch
        if: ${{ hashFiles('.github/automix-ios-check.patch') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/agent/automix-ios-check-20261108"
          git apply --check .github/automix-ios-check.patch
          git apply .github/automix-ios-check.patch
          git add Sonivo/playercore.swift tools/automix-lab/package.json tools/automix-lab/src/audio/analyzeTrack.ts tools/automix-lab/src/audio/keyCamelot.ts tools/automix-lab/src/audio/waveRadio.ts tools/automix-lab/src/iphone-mock.ts tools/automix-lab/scripts/smoke-camelot-roundtrip.mjs tools/automix-lab/scripts/test-tempo.mjs
          git rm .github/automix-ios-check.patch
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Improve AutoMix tempo analysis and transition effects"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git rev-parse HEAD > automix-build-commit.txt

      - name: Upload tested commit
        if: always() && hashFiles('automix-build-commit.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: automix-tested-commit
          path: automix-build-commit.txt


      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Test scripts and IPA delivery safety
        run: python3 .github/scripts/run_ci_tests.py

      - name: Compute version
        run: |
          RUN=${{ github.run_number }}
          PATCH=$((1 + RUN - 50))
          echo "MARKETING_VERSION=1.0.$PATCH" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$RUN" >> "$GITHUB_ENV"

      - name: Inject version into project.yml
        run: |
          sed -i '' -E "s/(MARKETING_VERSION: \")[0-9.]+(\")/\1${MARKETING_VERSION}\2/" project.yml
          sed -i '' -E "s/(CURRENT_PROJECT_VERSION: \")[0-9]+(\")/\1${BUILD_NUMBER}\2/" project.yml
          sed -i '' -E "s/(CFBundleShortVersionString: \")[0-9.]+(\")/\1${MARKETING_VERSION}\2/" project.yml
          sed -i '' -E "s/(CFBundleVersion: \")[0-9]+(\")/\1${BUILD_NUMBER}\2/" project.yml

      - name: Check for Apple Certificate Secrets
        id: cert_check
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROV_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASSWORD" ] && [ -n "$PROV_BASE64" ]; then
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
            echo "Apple Certificate secrets detected. Code signing ENABLED."
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "Apple Certificate secrets missing. Building unsigned."
          fi

      - name: Install Apple Certificate and Provisioning Profile
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROV_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CLEAN_PASS=$(echo -n "$P12_PASSWORD" | tr -d '\r\n')
          CERT_FILE="$RUNNER_TEMP/cert.p12"
          echo -n "$P12_BASE64" | tr -d '\r\n' | base64 --decode > "$CERT_FILE"

          # Apple's security import requires legacy 3DES encryption. If the p12 is modern AES-256 (OpenSSL 3), convert it.
          if ! security import "$CERT_FILE" -k "$KEYCHAIN_PATH" -P "$CLEAN_PASS" -T /usr/bin/codesign -T /usr/bin/security 2>/dev/null; then
            echo "Direct PKCS12 import failed (modern OpenSSL 3 PBES2 encryption detected). Converting to Apple-compatible format..."
            OPENSSL_BIN=$(which openssl || echo "/usr/bin/openssl")
            for candidate in /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl /opt/homebrew/bin/openssl; do
              if [ -x "$candidate" ]; then
                OPENSSL_BIN="$candidate"
                break
              fi
            done
            "$OPENSSL_BIN" pkcs12 -in "$CERT_FILE" -passin "pass:$CLEAN_PASS" -nodes -out "$RUNNER_TEMP/cert.pem"
            "$OPENSSL_BIN" pkcs12 -export -in "$RUNNER_TEMP/cert.pem" -out "$RUNNER_TEMP/cert-legacy.p12" -passout "pass:$CLEAN_PASS" -legacy 2>/dev/null || \
            "$OPENSSL_BIN" pkcs12 -export -in "$RUNNER_TEMP/cert.pem" -out "$RUNNER_TEMP/cert-legacy.p12" -passout "pass:$CLEAN_PASS"
            security import "$RUNNER_TEMP/cert-legacy.p12" -k "$KEYCHAIN_PATH" -P "$CLEAN_PASS" -T /usr/bin/codesign -T /usr/bin/security
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # Discover the exact signing identity imported
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$SIGNING_IDENTITY" ]; then
            SIGNING_IDENTITY="iPhone Distribution"
          fi

          PROV_FILE="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$PROV_BASE64" | tr -d '\r\n' | base64 --decode > "$PROV_FILE"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          PLIST_CONTENT=$(security cms -D -i "$PROV_FILE")
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$PLIST_CONTENT")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /dev/stdin <<< "$PLIST_CONTENT")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.team-identifier" /dev/stdin <<< "$PLIST_CONTENT")
          BUNDLE_ID="${APP_ID#${TEAM_ID}.}"

          cp "$PROV_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision

          echo "Configured Profile: UUID=$UUID, Team=$TEAM_ID, Bundle=$BUNDLE_ID"
          echo "Discovered Signing Identity: $SIGNING_IDENTITY"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "PROV_FILE=$PROV_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

          # Patch project.yml to match profile Bundle ID, Team ID and enable code signing
          python3 .github/scripts/patch_project_signing.py "$BUNDLE_ID" "$TEAM_ID" "$SIGNING_IDENTITY" "$UUID" project.yml

      - name: Configure Live Activity signing safely
        env:
          ACTIVITY_PROFILE_BASE64: ${{ secrets.SONIVO_ACTIVITY_PROFILE_BASE64 }}
        run: python3 .github/scripts/configure_live_activity.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate Live Activity extension without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Sonivo.xcodeproj -scheme SonivoLiveActivity \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath activity-validation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee activity-build.log

      - name: Upload Live Activity validation log
        if: always() && hashFiles('activity-build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: live-activity-build-log
          path: activity-build.log

      - name: Build app
        id: xcodebuild
        shell: bash
        run: |
          set -o pipefail
          if [ "$HAS_SIGNING" = "true" ]; then
            echo "==> Building and signing with developer certificate..."
            xcodebuild \
              -project Sonivo.xcodeproj \
              -scheme Sonivo \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath derived \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="${TEAM_ID}" \
              CODE_SIGN_IDENTITY="${SIGNING_IDENTITY}" \
              OTHER_CODE_SIGN_FLAGS="--keychain ${KEYCHAIN_PATH}" \
              build 2>&1 | tee build.log
          else
            echo "==> Building unsigned..."
            xcodebuild \
              -project Sonivo.xcodeproj \
              -scheme Sonivo \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath derived \
              CODE_SIGN_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build 2>&1 | tee build.log
          fi

      - name: Upload build log
        if: always() && hashFiles('build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Expose compiler errors
        if: failure() && hashFiles('build.log') != ''
        shell: bash
        run: |
          ERRORS=$(grep -E "(^|[[:space:]])[^[:space:]]+\.swift:[0-9]+:[0-9]+: error:" build.log | tail -n 12 | sed 's/%/%25/g; s/$/%0A/' | tr -d '\n' || true)
          if [ -z "$ERRORS" ]; then ERRORS=$(grep -E "error:" build.log | tail -n 12 | sed 's/%/%25/g; s/$/%0A/' | tr -d '\n' || true); fi
          echo "::error title=Swift compiler errors::$ERRORS"
          exit 1

      - name: Package IPA
        run: |
          APP=$(find derived/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP"
          echo "Found app: $APP"
          python3 scripts/verify_app_icon_bundle.py "$APP"

          if [ "$HAS_SIGNING" = "true" ]; then
            echo "==> Embedding provisioning profile into app bundle..."
            cp "$PROV_FILE" "$APP/embedded.mobileprovision"

            echo "==> Extracting entitlements from provisioning profile..."
            security cms -D -i "$PROV_FILE" > "$RUNNER_TEMP/profile.plist"
            /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"

            echo "Extracted entitlements:"
            cat "$RUNNER_TEMP/entitlements.plist"

            echo "==> Unlocking keychain before codesigning..."
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            echo "==> Signing any embedded frameworks or dylibs..."
            if [ -d "$APP/Frameworks" ]; then
              find "$APP/Frameworks" -mindepth 1 -maxdepth 2 \( -name "*.dylib" -o -name "*.framework" \) | while read -r item; do
                echo "Signing: $item"
                codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" --timestamp=none "$item" || true
              done
            fi

            if [ -d "$APP/PlugIns/SonivoLiveActivity.appex" ]; then
              test -n "$ACTIVITY_PROV_FILE"
              EXT="$APP/PlugIns/SonivoLiveActivity.appex"
              cp "$ACTIVITY_PROV_FILE" "$EXT/embedded.mobileprovision"
              security cms -D -i "$ACTIVITY_PROV_FILE" > "$RUNNER_TEMP/activity-profile.plist"
              /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/activity-profile.plist" > "$RUNNER_TEMP/activity-entitlements.plist"
              codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" \
                --entitlements "$RUNNER_TEMP/activity-entitlements.plist" --timestamp=none \
                --generate-entitlement-der "$EXT"
              codesign --verify --strict "$EXT"
            fi

            echo "==> Signing app bundle with entitlements..."
            codesign --force --sign "$SIGNING_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" \
              --entitlements "$RUNNER_TEMP/entitlements.plist" \
              --timestamp=none \
              --generate-entitlement-der \
              "$APP"

            echo "==> Verifying signature:"
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign -dvvv "$APP"

            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qry Sonivo.ipa Payload
            cp Sonivo.ipa Sonivo-unsigned.ipa
            echo "IPA_IS_SIGNED=true" >> "$GITHUB_ENV"
            echo "SUCCESS: Signed IPA packaged."
            ls -lh Sonivo.ipa
          else
            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qry Sonivo-unsigned.ipa Payload
            cp Sonivo-unsigned.ipa Sonivo.ipa
            echo "IPA_IS_SIGNED=false" >> "$GITHUB_ENV"
            ls -lh Sonivo-unsigned.ipa
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonivo-ipa
          path: |
            Sonivo.ipa
            Sonivo-unsigned.ipa
          if-no-files-found: error


      - name: Run iOS unit tests in simulator
        shell: bash
        run: |
          set -o pipefail
          xcrun simctl list devices available -j > /tmp/sim-devices.json
          SIMULATOR_ID=$(python3 -c 'import json; d=json.load(open("/tmp/sim-devices.json")); a=[x["udid"] for runtime,items in d["devices"].items() if "iOS-26" in runtime for x in items if x.get("isAvailable") and "iPhone" in x.get("name", "")]; print(a[0] if a else "")')
          test -n "$SIMULATOR_ID" || { echo "No iOS 26 iPhone simulator available"; exit 1; }
          xcodebuild -project Sonivo.xcodeproj -scheme Sonivo -configuration Debug -sdk iphonesimulator -destination "id=$SIMULATOR_ID" -derivedDataPath derived-tests CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" test 2>&1 | tee automix-tests.log

      - name: Upload test log
        if: always() && hashFiles('automix-tests.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: automix-ios-test-log
          path: automix-tests.log
